<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الذكاء الاصطناعي - العروض والمهام</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 2px solid var(--primary);
            margin-bottom: 30px;
            border-radius: 12px;
        }
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #60a5fa;
        }
        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .counter-box {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent);
            font-weight: bold;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }
        .task-card {
            background-color: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .task-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            background-color: #273548;
        }
        .task-card h3 {
            font-size: 1rem;
            color: #f1f5f9;
            margin-bottom: 5px;
        }
        .task-card span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .completed-msg {
            text-align: center;
            font-size: 1.5rem;
            color: var(--accent);
            padding: 50px;
            display: none;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>مهام عروض الذكاء الاصطناعي</h1>
            <p>اضغط على الخانات أدناه لتنفيذ المهام ومشاهدة المحتوى المتاح</p>
        </header>

        <div class="counter-box" id="counterBox">
            المهام المتبقية: <span id="remainingCount">50</span> / 50
        </div>

        <div class="grid-container" id="gridContainer">
            <!-- سيتم توليد الـ 50 خانة تلقائياً عبر الجافاسكربت -->
        </div>

        <div class="completed-msg" id="completedMsg">
            🎉 مبروك! لقد اتممت جميع الخانات بنجاح.
        </div>

        <footer>
            <p>&copy; 2026 جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <script>
        const directLinkUrl = "https://omg10.com/4/11609151";
        const totalTasks = 50;
        const gridContainer = document.getElementById('gridContainer');
        const remainingCountSpan = document.getElementById('remainingCount');
        const counterBox = document.getElementById('counterBox');
        const completedMsg = document.getElementById('completedMsg');

        let remaining = totalTasks;

        // توليد الـ 50 خانة تلقائياً
        for (let i = 1; i <= totalTasks; i++) {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.id = `task-${i}`;
            card.innerHTML = `
                <h3>خانة ${i}</h3>
                <span>اضغط للمشاهدة</span>
            `;

            // حدث الضغط على الخانة
            card.addEventListener('click', function() {
                // فتح الدايركت لينك في تبويب جديد
                window.open(directLinkUrl, '_blank');

                // إخفاء الخانة الحالية بتأثير انسيابي
                card.style.transition = "all 0.4s ease";
                card.style.transform = "scale(0)";
                card.style.opacity = "0";
                
                setTimeout(() => {
                    card.remove();
                    remaining--;
                    remainingCountSpan.textContent = remaining;

                    // إذا انتهت كل الخانات
                    if (remaining === 0) {
                        counterBox.style.display = 'none';
                        completedMsg.style.display = 'block';
                    }
                }, 400);
            });

            gridContainer.appendChild(card);
        }
    </script>
</body>
</html>
