<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر بسيط</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #eaeded; }
        header { background-color: #232f3e; color: white; padding: 10px 20px; display: flex; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; margin-left: 20px; }
        .search-bar { flex-grow: 1; display: flex; }
        .search-bar input { width: 100%; padding: 8px; border-radius: 4px 0 0 4px; border: none; }
        .search-bar button { padding: 8px 20px; background-color: #febd69; border: none; border-radius: 0 4px 4px 0; cursor: pointer; }
        
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card img { max-width: 100%; height: 150px; object-fit: contain; }
        .price { color: #b12704; font-weight: bold; font-size: 1.2em; margin: 10px 0; }
        .btn-buy { background-color: #f0c14b; border: 1px solid #a88734; padding: 8px; width: 100%; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <div class="logo">متجري</div>
    <div class="search-bar">
        <input type="text" placeholder="بحث عن منتجات...">
        <button>بحث</button>
    </div>
</header>

<div class="container">
    <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="منتج">
        <h3>هاتف ذكي</h3>
        <p class="price">$599</p>
        <button class="btn-buy">إضافة للسلة</button>
    </div>
    <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="منتج">
        <h3>سماعات لاسلكية</h3>
        <p class="price">$99</p>
        <button class="btn-buy">إضافة للسلة</button>
    </div>
    <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="منتج">
        <h3>ساعة ذكية</h3>
        <p class="price">$199</p>
        <button class="btn-buy">إضافة للسلة</button>
    </div>
    <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="منتج">
        <h3>حاسوب محمول</h3>
        <p class="price">$899</p>
        <button class="btn-buy">إضافة للسلة</button>
    </div>
</div>

</body>
</html>
